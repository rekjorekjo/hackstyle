name: CI
on: [push, pull_request]
permissions:
  contents: read
env:
  ASTRO_TELEMETRY_DISABLED: '1'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Ensure Chrome is available
        timeout-minutes: 5
        run: |
          if ! command -v google-chrome >/dev/null 2>&1; then
            npx playwright install --with-deps chrome
          fi
          google-chrome --version
      - run: npm run check
      - run: npm test
      - name: Build and audit root deployment
        env:
          SITE_URL: https://example.invalid
          BASE_PATH: /
        run: |
          npm run build
          npm run audit
      - name: Build and audit project subpath
        env:
          SITE_URL: https://example.invalid
          BASE_PATH: /hackstyle/
        run: |
          npm run build
          npm run audit
