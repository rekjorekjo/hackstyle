name: CI
on: [push, pull_request]
permissions:
  contents: read
env:
  ASTRO_TELEMETRY_DISABLED: '1'
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chrome
      - run: npm run check
      - run: npm test
  build:
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        base: ['/', '/hackstyle/']
    env:
      SITE_URL: https://example.invalid
      BASE_PATH: ${{ matrix.base }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chrome
      - run: npm run build
      - run: npm run audit
